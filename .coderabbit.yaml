# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# CodeRabbit Configuration — schema v2 (https://docs.coderabbit.ai/reference/yaml-template)

language: "pt-BR"
tone_instructions: "Seja objetivo e técnico. Priorize segurança, validação de entrada, tratamento de erros e correção de tipos TypeScript."

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - "redesign/.*"
      - "staging/.*"

  path_filters:
    - "!storybook-static/**"
    - "!**/*.min.js"
    - "!tests/baseline/**"

  path_instructions:
    - path: "src/**"
      instructions: |
        Foco em qualidade, performance e segurança:
        - Verifique tratamento de erros adequado
        - Confirme validação de entrada (Zod) e ausência de casts `as` não checados
        - Procure vulnerabilidades (SQL injection, XSS, exposição de segredos)
        - Garanta tipos TypeScript corretos
        - Sinalize `console.log`/`console.*` deixados em código de produção (use logger)
        - Sinalize TODO/FIXME/HACK pendentes
    - path: "**/*.test.ts"
      instructions: |
        Garanta cobertura de testes abrangente:
        - Verifique casos de borda
        - Cheque implementações de mocks
        - Garanta que as asserções sejam significativas
    - path: "docs/**"
      instructions: |
        Verifique qualidade da documentação:
        - Clareza e completude
        - Links quebrados
        - Exemplos corretos
    - path: ".github/workflows/**"
      instructions: |
        Verifique workflows do GitHub Actions:
        - Sintaxe YAML
        - Versões das actions fixadas
        - Problemas de segurança (secrets expostos, permissões amplas)

chat:
  auto_reply: true
