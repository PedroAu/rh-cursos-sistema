      $type: "typography"
      $value: "
        {
          'fontFamily': '{core.font-families.display}',
          'fontSize': '{core.font-sizes.3xl}',
          'fontWeight': '{core.font-weights.bold}',
          'lineHeight': '{core.line-heights.tight}'
        }
      "

# ============================================================================
# LAYER 3: COMPONENT TOKENS
# Component-specific values that combine semantic tokens
# ============================================================================

component:
  # Button Component
  button:
    primary:
      background:
        $type: "color"
        $value: "{semantic.colors.primary}"
      background-hover:
        $type: "color"
        $value: "{semantic.colors.primary-hover}"
      foreground:
        $type: "color"
        $value: "{semantic.colors.primary-foreground}"
      padding-inline:
        $type: "dimension"
        $value: "{core.spacing.md}"
      padding-block:
        $type: "dimension"
        $value: "{core.spacing.sm}"
      border-radius:
        $type: "dimension"
        $value: "{core.border-radius.md}"
      font-weight:
        $type: "fontWeight"
        $value: "{core.font-weights.semibold}"

    secondary:
      background:
        $type: "color"
        $value: "{semantic.colors.surface}"
      background-hover:
        $type: "color"
        $value: "{core.colors.neutral-100}"
      foreground:
        $type: "color"
        $value: "{semantic.colors.foreground}"
      border:
        $type: "color"
        $value: "{semantic.colors.border}"
      padding-inline:
        $type: "dimension"
        $value: "{core.spacing.md}"
      padding-block:
        $type: "dimension"
        $value: "{core.spacing.sm}"

    danger:
      background:
        $type: "color"
        $value: "{semantic.colors.danger}"
      foreground:
        $type: "color"
        $value: "{semantic.colors.primary-foreground}"
      padding-inline:
        $type: "dimension"
        $value: "{core.spacing.md}"
      padding-block:
        $type: "dimension"
        $value: "{core.spacing.sm}"

  # Form Input
  input:
    background:
      $type: "color"
      $value: "{semantic.colors.background}"
    border:
      $type: "color"
      $value: "{semantic.colors.border}"
    border-hover:
      $type: "color"
      $value: "{semantic.colors.border-strong}"
    border-focus:
      $type: "color"
      $value: "{semantic.colors.focus-ring}"
    foreground:
      $type: "color"
      $value: "{semantic.colors.foreground}"
    padding-inline:
      $type: "dimension"
      $value: "{core.spacing.sm}"
    padding-block:
      $type: "dimension"
      $value: "{core.spacing.sm}"
    border-radius:
      $type: "dimension"
      $value: "{core.border-radius.md}"

  # Card Component
  card:
    background:
      $type: "color"
      $value: "{semantic.colors.surface-raised}"
    border:
      $type: "color"
      $value: "{semantic.colors.border-subtle}"
    padding:
      $type: "dimension"
      $value: "{core.spacing.lg}"
    border-radius:
      $type: "dimension"
      $value: "{core.border-radius.lg}"
    shadow:
      $type: "shadow"
      $value: "{core.shadows.sm}"

  # Badge Component
  badge:
    background:
      $type: "color"
      $value: "{semantic.colors.surface}"
    foreground:
      $type: "color"
      $value: "{semantic.colors.foreground}"
    padding-inline:
      $type: "dimension"
      $value: "{core.spacing.sm}"
    padding-block:
      $type: "dimension"
      $value: "{core.spacing.xs}"
    border-radius:
      $type: "dimension"
      $value: "{core.border-radius.full}"
    font-size:
      $type: "dimension"
      $value: "{core.font-sizes.xs}"

# ============================================================================
# NOTES & CONVENTIONS
# ============================================================================

conventions:
  color-naming: "Semantic names (primary, success) over descriptive (blue-500)"
  spacing-naming: "Semantic scale (xs, sm, md, lg) based on Tailwind defaults"
  typography-naming: "Descriptive + semantic (body-lg, heading-md)"
  references: "Use {layer.category.token} syntax for cross-layer references"
  dark-mode: "Duplicate semantic layer for dark theme if needed"
  maintenance: "Update core layer, regenerate all exports via *tokenize"
