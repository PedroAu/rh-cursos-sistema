  spacing:
    padding-xs:
      $type: "dimension"
      $value: "{core.spacing.xs}"

    padding-sm:
      $type: "dimension"
      $value: "{core.spacing.sm}"

    padding-md:
      $type: "dimension"
      $value: "{core.spacing.md}"

    padding-lg:
