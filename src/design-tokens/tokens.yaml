    font-family-base:
      $type: "fontFamily"
      $value: "{core.font-families.sans}"

    font-family-display:
      $type: "fontFamily"
      $value: "{core.font-families.display}"

    body-sm:
      $type: "typography"
      $value: "
        {
          'fontFamily': '{core.font-families.sans}',
          'fontSize': '{core.font-sizes.sm}',
          'fontWeight': '{core.font-weights.normal}',
          'lineHeight': '{core.line-heights.normal}'
        }
      "

    body-base:
      $type: "typography"
      $value: "
        {
          'fontFamily': '{core.font-families.sans}',
          'fontSize': '{core.font-sizes.base}',
          'fontWeight': '{core.font-weights.normal}',
          'lineHeight': '{core.line-heights.normal}'
        }
      "

    body-lg:
      $type: "typography"
      $value: "
        {
          'fontFamily': '{core.font-families.sans}',
          'fontSize': '{core.font-sizes.lg}',
          'fontWeight': '{core.font-weights.normal}',
          'lineHeight': '{core.line-heights.relaxed}'
        }
      "

