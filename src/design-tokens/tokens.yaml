# ============================================================================
# LAYER 2: SEMANTIC TOKENS
# Context-aware aliases that map core primitives to meaning
# ============================================================================

semantic:
  colors:
    # Surface & Container Colors
    background:
      $type: "color"
      $value: "{core.colors.neutral-0}"
      $description: "Primary background (light mode)"

    surface:
      $type: "color"
      $value: "{core.colors.neutral-50}"
      $description: "Secondary surface layer"

    surface-raised:
      $type: "color"
      $value: "{core.colors.neutral-0}"
      $description: "Elevated surface (cards, containers)"

    # Text & Foreground
    foreground:
      $type: "color"
      $value: "{core.colors.neutral-900}"
      $description: "Primary text color"

    foreground-muted:
      $type: "color"
      $value: "{core.colors.neutral-600}"
      $description: "Secondary text (lighter)"

    foreground-subtle:
      $type: "color"
      $value: "{core.colors.neutral-500}"
      $description: "Tertiary text (lightest)"

    # Brand Colors (Semantic)
    primary:
      $type: "color"
      $value: "{core.colors.primary-blue}"
      $description: "Primary brand color"

    primary-hover:
      $type: "color"
      $value: "{core.colors.primary-blue-dark}"
      $description: "Primary color hover state"

    primary-foreground:
      $type: "color"
      $value: "{core.colors.neutral-0}"
      $description: "Text on primary background"

    accent:
      $type: "color"
      $value: "{core.colors.prestige-gold}"
      $description: "Accent/highlight color"

    # Status Colors (Semantic)
    success:
      $type: "color"
      $value: "{core.colors.success-green}"
      $description: "Success/positive state"

    warning:
      $type: "color"
      $value: "{core.colors.warning-yellow}"
      $description: "Warning/caution state"

    danger:
      $type: "color"
      $value: "{core.colors.error-red}"
      $description: "Error/danger state"

    # UI Elements
    border:
      $type: "color"
      $value: "{core.colors.neutral-200}"
      $description: "Default border color"

    border-subtle:
      $type: "color"
      $value: "{core.colors.neutral-100}"
      $description: "Subtle/lighter border"

    border-strong:
      $type: "color"
      $value: "{core.colors.neutral-300}"
      $description: "Strong/darker border"

    focus-ring:
      $type: "color"
      $value: "{core.colors.focus-ring}"
