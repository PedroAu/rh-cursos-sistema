<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/trust-keith-design-system-e3aaece8-51bd-4e84-9608-1b258b4c11e3/styles.css">
  <script src="_ds/trust-keith-design-system-e3aaece8-51bd-4e84-9608-1b258b4c11e3/_ds_bundle.js"></script>
  <style>
    *{box-sizing:border-box}
    :focus-visible{outline:2px solid #4d65ff;outline-offset:2px;border-radius:4px}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0.001ms !important;animation-duration:0.001ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important}}
    body{margin:0;background:#eef0f2}
  </style>
</helmet>

<div data-screen-label="Login" style="--rh-teal-deep:#0c6a83;--rh-teal:#1791a9;--rh-teal-lt:#37b7cc;--tk-brand:#0c6a83;--tk-brand-hover:#084f63;--tk-cta:#0c6a83;--tk-cta-hover:#084f63;--tk-accent:#1791a9;--tk-accent-strong:#0c6a83;--tk-accent-soft:#e0f2f6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:48px 24px;font-family:var(--tk-font-body);color:var(--tk-ink);background:radial-gradient(circle at 50% 20%, #f7fafb 30%, #e8eef0 100%)">

  <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <img src="uploads/logoHorizontal_800X600.png" alt="RH Cursos" style="height:52px;width:auto;display:block">
    <span style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--tk-brand);background:var(--tk-accent-soft);border-radius:var(--tk-radius-pill);padding:4px 12px">{{ badgeLabel }}</span>
  </div>

  <div style="width:400px;max-width:100%;background:var(--tk-surface);border:1px solid var(--tk-border);border-radius:24px;box-shadow:var(--tk-shadow-card);padding:36px 36px 32px">
    <h1 style="font-family:var(--tk-font-display);font-weight:700;font-size:25px;letter-spacing:-0.02em;line-height:1.15;margin:0 0 6px;text-align:center">Bem-vindo de volta</h1>
    <p style="font-size:var(--tk-text-body-sm);color:var(--tk-ink-muted);margin:0 0 26px;text-align:center">{{ subtitle }}</p>

    <form onSubmit="{{ handleSubmit }}" style="display:grid;gap:18px">
      <x-import component-from-global-scope="TrustKeithDesignSystem_e3aaec.Input" label="E-mail" type="email" placeholder="voce@empresa.com.br" auto-complete="email" hint-size="100%,68px"></x-import>
      <x-import component-from-global-scope="TrustKeithDesignSystem_e3aaec.Input" label="Senha" type="password" placeholder="••••••••" auto-complete="current-password" hint-size="100%,68px"></x-import>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:-2px">
        <sc-if value="{{ showRemember }}" hint-placeholder-val="{{ true }}">
          <x-import component-from-global-scope="TrustKeithDesignSystem_e3aaec.Checkbox" checked="{{ remember }}" onChange="{{ toggleRemember }}" label="Manter conectado" hint-size="140px,20px"></x-import>
        </sc-if>
        <a href="#" style="font-size:var(--tk-text-body-sm);font-weight:600;color:var(--tk-accent);text-decoration:none;margin-left:auto" style-hover="color:var(--tk-accent-strong)">Esqueci minha senha</a>
      </div>

      <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="display:flex;align-items:center;gap:9px;font-size:var(--tk-text-body-sm);color:var(--tk-error,#ea384c);background:#fdeef0;border:1px solid #f7ccd2;border-radius:8px;padding:10px 13px">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 7.5v5.5M12 16.4v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
          E-mail ou senha incorretos. Tente novamente.
        </div>
      </sc-if>

      <x-import component-from-global-scope="TrustKeithDesignSystem_e3aaec.Button" variant="primary" size="lg" type="submit" full-width="{{ true }}" hint-size="100%,48px">{{ submitLabel }}</x-import>
    </form>
  </div>

  <div style="display:flex;align-items:center;gap:16px;font-size:var(--tk-text-body-sm);color:var(--tk-ink-muted)">
    <a href="RH Cursos Home.dc.html" style="color:var(--tk-ink-muted);text-decoration:none;font-weight:500" style-hover="color:var(--tk-accent-strong)">← Voltar ao site</a>
    <span aria-hidden="true" style="width:3px;height:3px;border-radius:50%;background:var(--tk-ink-muted);display:inline-block"></span>
    <span>Precisa de acesso? <a href="#" style="color:var(--tk-accent);font-weight:600;text-decoration:none" style-hover="color:var(--tk-accent-strong)">Fale com a coordenação</a></span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;portal&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Área administrativa&quot;, &quot;Portal do aluno&quot;, &quot;Portal do instrutor&quot;], &quot;default&quot;: &quot;Área administrativa&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Conteúdo&quot; },
  &quot;showRemember&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Formulário&quot; },
  &quot;showError&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Formulário&quot; }
}">
class Component extends DCLogic {
  state = { remember: true, submitting: false };

  renderVals() {
    const portal = this.props.portal ?? "Área administrativa";
    const subtitles = {
      "Área administrativa": "Acesse o painel de gestão da RH Cursos.",
      "Portal do aluno": "Acesse seus cursos, certificados e materiais.",
      "Portal do instrutor": "Acesse suas turmas, agendas e avaliações."
    };
    return {
      badgeLabel: portal,
      subtitle: subtitles[portal] || subtitles["Área administrativa"],
      showRemember: this.props.showRemember ?? true,
      showError: this.props.showError ?? false,
      remember: this.state.remember,
      toggleRemember: () => this.setState(s => ({ remember: !s.remember })),
      submitLabel: this.state.submitting ? "Entrando…" : "Entrar",
      handleSubmit: (e) => {
        e.preventDefault();
        this.setState({ submitting: true });
        clearTimeout(this._t);
        this._t = setTimeout(() => this.setState({ submitting: false }), 1400);
      }
    };
  }
}
</script>
</body>
</html>
