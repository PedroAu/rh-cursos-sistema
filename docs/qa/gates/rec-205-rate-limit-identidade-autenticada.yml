story: 'REC-205'
story_title: 'Expandir rate limiting para identidade autenticada'
gate: PASS
status_reason: >-
  Estende APENAS a composição da chave de rate limit da inscrição pública:
  buildRateLimitKey(scope, ip, userId?) mantém a chave anônima byte-idêntica
  a REC-107 (enrollment:<ip>) e, quando há sessão SSR ativa (REC-202),
  anexa um identificador do usuário (enrollment:<ip>:user:<hash>) só para
  granularidade de bucket. Nenhuma decisão de autorização foi introduzida —
  grep confirma zero uso de resolveServerRole/requireServerRole (REC-203)
  em app/api/enrollments/route.ts. git status confirma que os arquivos de
  auth HMAC de produção (auth.ts, _shared/auth.ts, session/route.ts) não
  foram modificados; authorize.ts (REC-203) permanece untracked e não
  referenciado. Identificador é hash SHA-256 truncado (sem PII persistida);
  leitura best-effort com try/catch degradando para null (NFR-04). Suíte
  agregada 638/638 (+6 testes sobre 632), lint/typecheck limpos.
reviewer: '@qa (Quinn)'
