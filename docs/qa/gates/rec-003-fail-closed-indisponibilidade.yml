schema: 1
story: 'REC-003'
story_title: 'Ativar indisponibilidade fail-closed quando necessário'
gate: PASS
status_reason: >-
  Kill-switch INCIDENT_LOCKDOWN implementado e verificado independentemente:
  guarda presente e posicionada corretamente (antes de requireAdmin()/CORS/
  rate-limit/lógica de negócio) nos 4 pontos de entrada reais identificados
  por investigação de árvore de arquivos, não apenas os 2 citados no Dev
  Notes original (admin-resources, enrollments Edge Function, leads Edge
  Function, e app/api/enrollments/route.ts como caminho alternativo Next.js
  vivo em produção via Cloudflare Workers/OpenNext). Fail-closed por padrão
  confirmado por teste automatizado (erro de leitura → bloqueia). Sem
  impacto quando inativo, sem regressão de lógica pré-existente. Único gap:
  integração real do runtime Deno não testada neste ambiente (sem deno/
  supabase CLI interativo) — mitigado por portagem 1:1 revisada linha a
  linha do módulo Node já testado, e pelo padrão idêntico já usado em
  supabase/functions/_shared/auth.ts.
