schema: 1
story: 'REC-308'
story_title: 'Corrigir acessibilidade crítica'
gate: PASS
quality_score: 96
status_reason: >-
  Auditoria de acessibilidade WCAG 2.1 AA das jornadas críticas concluída pelo
  executor. Uma única violação SÉRIA encontrada e corrigida: no formulário de
  pré-inscrição (src/views/public/CourseCheckout.tsx, componente Field) o erro
  de validação não era associado ao campo (sem aria-describedby, sem
  aria-invalid) e ficava dentro de um <label> implícito — leitor de tela não
  vinculava o erro ao input. Corrigido com id/htmlFor explícitos, clone do
  controle para injetar aria-describedby + aria-invalid, e id no erro (role=alert
  preservado). Login (REC-305) e navegação admin (REC-306) auditados e
  confirmados JÁ conformes — nenhuma correção inventada (Article IV); adicionadas
  travas de regressão. Catálogo público (Courses/CourseDetail) auditado: sem
  violação séria/crítica; duas pendências de baixa severidade documentadas
  (P-308-1 ícones decorativos sem aria-hidden; P-308-2 overlay Play decorativo).
  A revisão independente executou também npm run test:a11y em browser real:
  9/9 testes Axe WCAG 2.1 A/AA passaram. As duas pendências cosméticas de
  baixa severidade permanecem como follow-up não bloqueante.
reviewer: '@qa (Quinn)'
