  - id: SEC-002
    severity: medium
    finding: >-
      Segregação de funções ausente: @data-engineer, @dev e @po acumulados pelo
      mesmo responsável humano (Pedro Augusto) por decisão explícita do Incident
      Commander (não por inferência). Risco operacional inerente a comando de
      pessoa única durante o SEV-0, aceito pelo IC e não corrigível nesta story;
      @qa permanece independente. Risco a carregar, não defeito do entregável.
    suggested_owner: incident-commander
    suggested_action: >-
      Carregar como risco operacional aceito e reavaliar se um segundo
      responsável humano pode assumir ao menos o gate de decisão de negócio nas
      ondas seguintes.
    refs:
      - 'docs/history/reports/rec-001-sev0-incident-2026-07-14.md#2-comando-do-incidente-e-responsaveis'
  - id: REL-001
    severity: medium
    finding: >-
      GitHub Audit Log de organização indisponível (conta pessoal, endpoint
      404). Evidência de eventos limitada a Actions runs e /events (~90 dias),
      sem trilha de auditoria completa — cadeia de custódia parcial em AC5.
    suggested_owner: devops
    suggested_action: >-
      Aceitar como limitação estrutural da conta pessoal; documentar que a
      trilha completa exigiria conta de organização/Enterprise.
    refs:
      - 'docs/history/reports/rec-001-sev0-incident-2026-07-14.md#5-evidencias-preservadas-ac5-ac8'

