schema: 1
story: 'REC-001'
story_title: 'Declarar incidente, congelar mudanças e preservar evidências'
gate: PASS
status_reason: >-
  Incidente contido (gate G0). GitHub congelado e verificado de forma
  independente (lock_branch=true, 4 workflows de deploy/release
  disabled_manually, zero execução concorrente). Os dois canais de deploy de
  produção que estavam abertos foram fechados pela ação corretiva do Incident
  Commander (seção 4.1 do relatório): exclusão de todos os Access Tokens do
  Supabase e de todos os API Tokens da Cloudflare — controle equivalente e
  definitivo (AC3). Supabase corroborado tecnicamente (supabase projects list →
  Unauthorized com o token antes válido); Cloudflare por atestação do IC,
  documentada com a limitação de verificação. Evidência sanitizada sem
  segredo/PII. Residuais low, não bloqueantes: screenshot da Cloudflare para o
  registro; captura dos audit logs de provedor ao longo de REC-002; segregação
  de funções a reavaliar.
reviewer: 'Quinn (Test Architect)'
updated: '2026-07-16T00:15:00Z'
expires: '2026-07-30T00:00:00Z'
quality_score: 90

history:
  - date: '2026-07-15T21:40:00Z'
    gate: FAIL
    revised_reason: >-
      Veredito inicial FAIL revisto para CONCERNS após re-exame do AC7. O AC7
      não manda FALHAR quando um ambiente não pode ser congelado — manda
      registrar NO-GO e escalar (feito), impondo só o veto ao PASS. Reavaliação
      de SEC-001/SEC-002 de high para medium.
  - date: '2026-07-15T22:40:00Z'
    gate: CONCERNS
    revised_reason: >-
      Re-review confirmou CONCERNS enquanto Supabase/Cloudflare seguiam sem
      freeze comprovado (sem ação do owner à época).
  - date: '2026-07-16T00:15:00Z'
    gate: PASS
    revised_reason: >-
      Promovido a PASS após o Incident Commander executar e documentar (seção
      4.1) a exclusão de todos os tokens de deploy/API do Supabase e da
      Cloudflare, fechando os dois canais de produção que restavam. Supabase
      corroborado tecnicamente (Unauthorized); Cloudflare por atestação do IC
      com limitação registrada. SEC-001 encerrado; residuais rebaixados a low.

