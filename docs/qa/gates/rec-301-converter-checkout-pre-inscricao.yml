nfr_validation:
  security:
    status: PASS
    notes: >-
      Zero coleta financeira pública; schemas strict fail-closed nas duas
      bordas; RPC SECURITY DEFINER com search_path fixado; rate limit + guarda
      de configuração retornando 503; nenhum payload/PII em logs; referência
      opaca (codigo_confirmacao) sem derivação de PII.
  performance:
    status: PASS
    notes: >-
      FOR UPDATE serializa apenas a linha da turma; consultas com limit; sem
      novo hot path. Build de produção com 29 páginas OK.
  reliability:
    status: PASS
    notes: >-
      Fail-closed em produção sem Functions, network error, timeout, non-2xx e
      envelope inválido; nenhum caminho produz sucesso local sem recibo
      persistido.
  maintainability:
    status: PASS
    notes: >-
      Contrato público reutiliza store-types (EnrollmentPayload omite
      paymentMethod); schema espelhado na Edge documentado até REC-206;
      testes test-first legíveis e direcionados.

