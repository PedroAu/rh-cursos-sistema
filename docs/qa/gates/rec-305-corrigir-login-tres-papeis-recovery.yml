schema: 1
story: 'REC-305'
story_title: 'Corrigir login dos três papéis e recovery'
gate: PASS
quality_score: 95
status_reason: >-
  Bugfix restrito de FND-07 (login dos três papéis + recovery), mantendo o HMAC
  como único mecanismo de sessão exatamente como hoje. Investigação confirmou
  que o destino pós-login JÁ deriva do papel server-side: Login.tsx redireciona
  por data.session.role (resposta do servidor), e o endpoint HMAC
  app/api/auth/session/route.ts é autoritativo — deriva o papel de
  app_metadata.role (route.ts:132) e responde 403 quando o portal pedido diverge
  do papel real (route.ts:137-139). Nenhum bug de destino foi inventado
  (Article IV); a lacuna real era ausência de trava de regressão
  (session-routing.ts sem testes; sem teste de componente da derivação), agora
  fechada (+16 testes). O defeito real era o recovery: o botão "Esqueci minha
  senha" disparava toast.success incondicional sem nenhuma chamada de rede nem
  fluxo de reset por trás — falso sucesso (antipadrão de REC-302), violando
  Article IV/FR-10. Recuperação de autosserviço real exigiria feature NET-NEW
  (página reset-password + token), fora do bugfix; seguindo "recovery é real ou
  removido", o controle enganoso foi REMOVIDO e o canal real ("Fale com a
  coordenação" → /contato) mantido. Nenhum arquivo de autenticação (HMAC/SSR)
  tocado; isto NÃO é o cutover de REC-204. Suíte 694 → 710 (+16), lint/typecheck
  limpos.
reviewer: '@qa (Quinn)'
updated: '2026-07-17T14:55:00Z'
expires: '2026-07-31T00:00:00Z'

