    previous_state: 'toast.success("Link de recuperação enviado...") incondicional; nenhuma chamada de rede; nenhum fluxo de reset por trás'
    decision: REMOVED
    justification: >-
      Falso sucesso (antipadrão de REC-302), viola Article IV/FR-10. Reset de
      autosserviço real é feature NET-NEW arquitetural (página reset-password +
      resetPasswordForEmail + token), fora do bugfix. Canal de recuperação real
      já existe na mesma tela ("Fale com a coordenação" → /contato); botão falso
      era duplicado enganoso.
  - control: '"Fale com a coordenação" (→ /contato)'
    previous_state: 'funcional'
    decision: KEPT
    justification: 'Canal de recuperação/acesso real (atendimento humano) hoje. Rota real e funcional.'

login_destination_finding:
  status: ALREADY_SERVER_SIDE
  detail: >-
    Login.tsx redireciona por data.session.role (resposta server-side), não pelo
    pathname. route.ts:132 deriva o papel de app_metadata.role; route.ts:137-139
    retorna 403 em divergência portal/papel. ?next validado por isRolePathAllowed
    (sem open redirect). Sem alteração de código no destino; travado por testes.

