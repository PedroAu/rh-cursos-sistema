  Met: AC1 (.env.example sanitized) and AC4 (no .env tracked in git — only .env.example; .next/.open-next gitignored).
  Not met: AC2 (secrets present in deploy bundle, not excluded from packaging) and AC3 (hygiene check is a false-pass no-op).
  All secret values were masked during QA; none were printed.
  Open verification for @devops: does opennextjs-cloudflare deploy upload .open-next/server-functions/default/.env to the Worker? QA confirmed the file exists in the bundle directory but not the upload scope.
  Returning story to InProgress for @dev/@devops fixes (HYG-001/002/003).
