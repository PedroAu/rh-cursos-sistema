  - id: AC1
    status: PASS
    evidence: 'checkEnvExample() enforces placeholder-only secret values; .env.example is sanitized.'
  - id: AC2
    status: FAIL
    evidence: '.next/standalone/.env regenerates each build and is not excluded from packaging. Real deploy bundle .open-next/server-functions/default/.env contains AIOX-installer LLM keys copied from root .env. No durable removal, no documented/enforced exclusion.'
  - id: AC3
    status: FAIL
    evidence: 'check-secret-hygiene.mjs checkGeneratedEnvArtifacts() never matches: git status --ignored --short .next returns collapsed "!! .next/", so .endsWith("/.env") fails. npm run security:secrets PASSES while .next/standalone/.env exists. .open-next is never inspected.'
