top_issues:
  - id: 'HYG-001'
    severity: high
    finding: 'checkGeneratedEnvArtifacts() is a no-op. git status --ignored collapses ignored dirs to "!! .next/", so the nested .env is never detected. The check returns PASS even when .next/standalone/.env exists with real secrets (verified by execution).'
    suggested_action: 'Replace the git-status approach with a filesystem scan: find .next .open-next -path "*/.env" -type f; fail if any exist. Add a unit test fixture that asserts FAIL when such a file is present.'
  - id: 'HYG-002'
    severity: high
    finding: 'Real deploy bundle .open-next/server-functions/default/.env contains AIOX-installer LLM secrets (DeepSeek/OpenRouter/Anthropic/OpenAI), copied from the project root .env. The hygiene check never inspects .open-next.'
    suggested_action: 'Keep AIOX tooling secrets out of the app root .env (move to a non-copied location), and/or strip .env from the build/deploy bundle. Confirm with @devops whether opennextjs-cloudflare deploy uploads server-functions/**/.env. Document the mitigation in secret-hygiene-check.md.'
  - id: 'HYG-003'
    severity: medium
    finding: 'If any LLM keys in the root .env were ever shared/committed/bundled remotely, they should be rotated.'
    suggested_action: 'Rotate exposed keys per Dev Notes rotation rule once exposure scope is confirmed.'

