schema: 1
story: 'REC-206'
story_title: 'Consolidar BFF canônico (remover contrato duplicado de leitura de leads no browser)'
gate: PASS
status_reason: >-
  Consolida o roteamento de LEITURA de leads administrativos no browser em um
  único contrato same-origin: admin-resources leads/list, roteado por
  /api/functions/[name] e protegido pelo HMAC real de produção (requireAdmin).
  O contrato duplicado — fetchLeadsFromSupabase, leitura direta do cliente
  Supabase browser (Supabase Auth + RLS) contra *.supabase.co — foi removido de
  app-store.tsx e de rh-cursos-api.ts; o refetch realtime (scheduleLeadRefetch)
  também passou a trafegar same-origin (BFF). Nenhuma autoridade de autorização
  foi introduzida: grep confirma zero uso de resolveServerRole/requireServerRole
  (REC-203); git status confirma que auth.ts, _shared/auth.ts e session/route.ts
  (HMAC de produção) não foram modificados. Os read models completos de
  alunos/inscrições (paginação/filtros/autorização) NÃO foram antecipados —
  fronteira com REC-303/304 preservada. Transporte realtime (WebSocket direto)
  e leituras públicas de catálogo permanecem diferidos e documentados. Suíte
  agregada 639/639 (+1 teste sobre 638), lint/typecheck limpos.
reviewer: '@qa (Quinn)'
