schema: 1
story: 'REC-202'
story_title: 'Implementar sessão Supabase SSR'
gate: PASS
status_reason: >-
  Implementa D2 (cookies httpOnly/secure/SameSite=Lax via @supabase/ssr,
  já dependência existente) e D3 (AAL2 obrigatório e fail-closed quando MFA
  ativo) do ADR-016, como caminho ADITIVO — decisão de design (rota nova
  /api/auth/ssr-session, independente do POST HMAC existente) elimina o
  risco de lockout documentado na Épica 17 por construção: nenhuma linha
  do fluxo HMAC (src/lib/auth.ts, auth-session.ts, session-token.ts,
  supabase/functions/_shared/auth.ts, app/api/auth/session/route.ts)
  foi tocada, confirmado por git status. Lógica de AAL2 revisada linha a
  linha: toda falha de challenge/verify/nível encerra a sessão (signOut),
  nunca deixa AAL1 abrir sessão admin quando há fator MFA ativo — fail-
  closed real, fecha SEC-104 no novo caminho. Nenhuma chamada de rede real
  contra produção; 15 testes mockados cobrindo o contrato completo.
  Suíte agregada 621/621, lint/typecheck limpos.
reviewer: '@qa (Quinn) + @architect (Aria)'
updated: '2026-07-17T00:00:00Z'
expires: '2026-07-30T00:00:00Z'
quality_score: 94

