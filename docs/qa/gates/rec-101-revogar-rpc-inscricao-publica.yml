top_issues:
  - id: SEC-107
    severity: medium
    finding: >-
      Validação HTTP real via PostgREST (curl/cliente real com chave anon e
      authenticated contra rpc/registrar_inscricao_publica) não foi
      executada. A evidência de ACL de banco (has_function_privilege) é
      tecnicamente equivalente — consulta o mesmo catálogo pg_proc que o
      PostgREST usa para autorizar — mas os quality_gate_tools da própria
      story pedem "teste negativo de chamada direta à RPC via PostgREST".
    suggested_owner: qa
    suggested_action: >-
      Não bloqueia G0 (REC-101 não é da Onda 0), mas recomenda-se executar o
      teste HTTP real (mesmo padrão usado por REC-102, via supabase start)
      antes de contar REC-101 como encerrando G1/G2 para reabertura de
      catálogo/pré-inscrição.
    refs:
      - 'docs/history/reports/rec-101-revogar-rpc-2026-07-15.md#5-validação-http-real--gap-explícito'
  - id: REL-104
    severity: low
    finding: >-
      Uma asserção do teste original desta story (nº 9, sobre anon manter
      insert em public.lead) ficou desatualizada por interação com REC-102
      (aplicada na mesma sequência de migrations) e foi removida durante
      esta revisão de QA, não pelo executor original.
    suggested_owner: qa
    suggested_action: >-
      Aceito — a asserção era redundante com a cobertura equivalente em
      rec-102-revoke-anon-lead-insert.test.sql. Nenhuma perda de cobertura.
    refs:
      - 'supabase/tests/database/rec-101-revoke-public-enrollment-rpc.test.sql'

