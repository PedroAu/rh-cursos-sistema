schema: 1
story: 'REC-101'
story_title: 'Revogar RPC pública de inscrição'
gate: CONCERNS
status_reason: >-
  Migration de revogação tecnicamente sólida e verificada contra banco real
  (npm run test:db, suíte completa PASS, 58/58 testes incluindo os 8 desta
  story). has_function_privilege() confirma anon/authenticated/public sem
  execute na RPC, service_role preservado, idempotência e ausência de
  regressão em is_admin()/leitura pública. Mantido CONCERNS (não PASS) por
  um gap declarado pelo próprio executor: a validação HTTP real via
  PostgREST (curl com chave anon/authenticated contra o endpoint REST) não
  foi exercitada para esta story especificamente — diferente da story
  irmã REC-102, que rodou o teste HTTP real via supabase start. A evidência
  de ACL de banco é o equivalente correto ao que o PostgREST consulta, mas
  não substitui integralmente a chamada HTTP fim-a-fim exigida pelos
  quality_gate_tools declarados na própria story.
reviewer: '@qa (Quinn)'
