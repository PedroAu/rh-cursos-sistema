story_title: 'Endurecer endpoints públicos (inscrição)'
gate: PASS
status_reason: >-
  Endpoint de inscrição pública restaurado via adminClient()/
  createSupabaseServerClient() (service-role) exclusivamente na chamada da
  RPC, seguindo o mesmo padrão já validado por REC-102 para o dilema
  estruturalmente idêntico em leads/index.ts. Nenhum grant execute
  restaurado para anon/authenticated — REC-101 permanece intacta,
  confirmado por teste pgTAP novo. Least privilege preservado: leituras de
  turma permanecem no cliente público em ambos os pontos de entrada,
  incluindo correção de uma inconsistência pré-existente na rota Next.js.
  Body limit adicionado (8 KiB, Content-Length + tamanho real). Idempotência
  analisada com honestidade — índice único parcial já é a barreira real,
  hardening pontual do mapeamento de erro 23505. Gap de CAPTCHA documentado
  com transparência, sem invenção de dependência externa (Article IV).
  Suíte agregada 113/113 (banco) + 601/601 (Vitest), lint/typecheck limpos.
