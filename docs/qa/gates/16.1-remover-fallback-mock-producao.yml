top_issues:
  - id: "REL-001"
    severity: high
    category: reliability
    finding: >-
      src/lib/supabase/query-logging-middleware.ts (linhas 52-83) sobrescreve
      query.select() para retornar `originalSelect(...).then(...)` — ou seja, uma
      Promise nativa em vez do PostgrestFilterBuilder. Toda query que encadeia
      filtro após .select() (.eq/.order/.not/.single) lança "X is not a function".
      No fetchPublicCatalog isso atinge curso(.order), turma(.order),
      instrutor(.order), trilha(.eq), curso_public_content(.eq) e
      fetchCourseCategories(.not). Só o client BROWSER (client.ts) é envolvido; o
      server client (server.ts) não, por isso o SSR funciona e o bug ficou latente.
    evidence: >-
      e2e epic15-admin-dashboard-fidelity (bundle de produção real, next start :3100):
      "Falha ao carregar catálogo público do Supabase: TypeError:
      e.from(...).select(...).eq is not a function". Middleware introduzido em
      1c7f0a6 (wave-4), anterior às Stories 15.1/16.1.
    impact: >-
      Antes da Épica 16, esse erro era mascarado pelo fallback de mock — por isso
      dados fictícios apareciam em produção mesmo após limpar o banco (o fallback
      disparava em TODO load client-side, não só em vazio/erro). Após 16.1, o
      catálogo público client-bootstrapped (ex.: admin dashboard, e a verificar:
      home/listagem) carrega vazio + toast de erro em vez de dados reais. O
      objetivo da épica ("catálogo real reflete o banco") não é alcançado
      client-side enquanto o middleware não for corrigido.
    suggested_owner: dev
    suggested_action: >-
      Corrigir o middleware para preservar o builder encadeável. Em vez de
      substituir .select() por uma Promise, medir a latência sem quebrar a cadeia
      (ex.: envolver apenas o .then/await no ponto de execução, ou usar um Proxy
      que delega métodos do builder e cronometra na resolução). Adicionar teste de
      regressão que exercite .from().select().eq()/.order() via o client envolvido.
      Recomenda-se story dedicada (blast radius = todas as queries do browser).
  - id: "REL-002"
    severity: low
    category: reliability
    ac: AC5
    finding: >-
      fetchPublicCatalog retorna null (sem lançar) quando o client é null (env
      ausente). Nesse caminho o bootstrap cai no .then (não no .catch), preserva
      estado atual e NÃO dispara toast — erro de configuração fica silencioso
      (mostra vazio, não mock). Fora do escopo estrito do AC5 (rede/RLS/timeout) e
      não ocorre em produção configurada; registrado por completude.
    suggested_owner: dev
    suggested_action: >-
      Opcional: tratar client null como estado de erro visível também, ou logar
      um aviso claro de configuração ausente.

