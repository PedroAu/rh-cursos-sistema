status_reason: >-
  Implementa D1 do ADR-016 como infraestrutura pura, sem ativação em
  nenhuma rota real: resolveServerRole() consulta app_metadata.role fresco
  via client.auth.getUser() a cada chamada (sem cache/payload assinado,
  mesma fonte já validada por REC-202 — Article IV respeitado);
  requireServerRole() é o helper fail-closed pronto para consumo futuro.
  Confirmado por git status que nenhum arquivo HMAC (auth.ts,
  _shared/auth.ts, session/route.ts) nem os arquivos de REC-202
  (session.ts, ssr-session/route.ts) foram modificados — apenas lidos/
  importados. Rebaixamento de papel comprovado bloqueando a requisição
  seguinte via teste com mock sequenciado (admin → student entre duas
  chamadas). HMAC confirmado como única autoridade real em produção,
  sem exceção. Suíte agregada 632/632 (+11 testes novos), lint/typecheck
  limpos.
