name: CI Pipeline

on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      production_safe_smoke:
        description: "Run only read-only public smoke tests against production secrets."
        required: false
        type: boolean
        default: false
    secrets:
      NEXT_PUBLIC_SUPABASE_URL:
        required: false
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
        required: false
      NEXT_PUBLIC_APP_URL:
        required: false
      AUTH_SESSION_SECRET:
        required: false

# Least-privilege default token: jobs only read repo contents.
permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder_key' }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://127.0.0.1:3000' }}
  AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET || 'ci-auth-session-secret-placeholder-32' }}

# Cancel superseded runs on the same ref to keep the queue fast.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lane 1 — Fast static checks. Type errors fail before the slower lint pass.
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # Lane 2 — Unit tests with coverage gate. Vitest parallelises internally.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage

  # Lane 3 — Production build + accessibility gate (Axe-core) + E2E smoke.
  e2e:
    name: Build & A11y & E2E
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Accessibility gate (Axe-core WCAG 2.1 A/AA)
        run: npm run test:a11y
      - name: E2E smoke
        run: |
          if [[ "${PRODUCTION_SAFE_SMOKE}" == "true" ]]; then
            node scripts/run-playwright.mjs tests/smoke-crawl.spec.ts --grep "páginas públicas" --project=functional
          else
            npm run test:e2e:smoke
          fi
        env:
          PRODUCTION_SAFE_SMOKE: ${{ inputs.production_safe_smoke }}

  # Lane 4 — API docs lint/build/drift gate.
  docs-api:
    name: API Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run docs:api:lint
      - run: npm run docs:api:build
      - run: npm run docs:api:check-drift

  # Lane 5 — Performance: bundle size budgets + Lighthouse CI per-route budgets.
  performance:
    name: Performance Budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Single production build that also enforces the build-time budget.
      # Budgets are intentionally generous for shared CI runners (slower than a
      # dev laptop): they catch gross regressions without flaking on variance.
      # Override locally via BUILD_COMPILE_BUDGET_S / BUILD_WALL_BUDGET_S.
      - name: Build + build-time budget
        run: npm run build:time-check
        env:
          BUILD_COMPILE_BUDGET_S: '30'
          BUILD_WALL_BUDGET_S: '120'
      - name: Bundle size budget
        run: npm run bundle:check
      - name: CSS size budget
        run: npm run css:check
      - name: Lighthouse CI (per-route budgets)
        run: npx lhci autorun --config=./lighthouserc.cjs

  # Lane 6b — Secret scanning gate. Blocks (does not just warn) if a secret is
  # detected in the diff/branch. Complements the local pre-commit hook, which
  # only warns and only runs on the committer's machine.
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  # Lane 6 — Database contract tests.
  db-tests:
    name: DB Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.105.0
      - run: npm run test:db
