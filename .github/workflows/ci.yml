name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder_key' }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://127.0.0.1:3000' }}
  AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET || 'ci-auth-session-secret-placeholder-32' }}

# Cancel superseded runs on the same ref to keep the queue fast.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lane 1 — Fast static checks. Type errors fail before the slower lint pass.
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # Lane 2 — Unit tests with coverage gate. Vitest parallelises internally.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage

  # Lane 3 — Production build + accessibility gate (Axe-core) + E2E smoke.
  e2e:
    name: Build & A11y & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Accessibility gate (Axe-core WCAG 2.1 A/AA)
        run: npm run test:a11y
      - name: E2E smoke
        run: npm run test:e2e:smoke

  # Lane 4 — API docs lint/build/drift gate.
  docs-api:
    name: API Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run docs:api:lint
      - run: npm run docs:api:build
      - run: npm run docs:api:check-drift

  # Lane 5 — Performance: bundle size budgets + Lighthouse CI per-route budgets.
  performance:
    name: Performance Budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Bundle size budget
        run: npm run bundle:check
      - name: Lighthouse CI (per-route budgets)
        run: npx lhci autorun --config=./lighthouserc.cjs

  # Lane 6 — Database contract tests.
  db-tests:
    name: DB Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - run: npm run test:db
