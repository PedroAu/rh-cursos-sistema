name: Deploy Supabase Edge Functions

# Modelo atual: frontend estático no Cloudflare Pages e backend em Edge
# Functions publicadas no Supabase por este workflow.

on:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_PROJECT_REF:
        required: true
      AUTH_SESSION_SECRET:
        required: true
      NEXT_PUBLIC_APP_URL:
        required: true
      EXTRA_ALLOWED_ORIGINS:
        required: true

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    name: Deploy Edge Functions
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.105.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Set function secrets
        run: |
          supabase secrets set \
            AUTH_SESSION_SECRET="$AUTH_SESSION_SECRET" \
            PUBLIC_APP_URL="$PUBLIC_APP_URL" \
            EXTRA_ALLOWED_ORIGINS="$EXTRA_ALLOWED_ORIGINS" \
            --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          EXTRA_ALLOWED_ORIGINS: ${{ secrets.EXTRA_ALLOWED_ORIGINS }}

      - name: Deploy functions
        run: |
          supabase functions deploy leads --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy enrollments --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy admin-resources --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Summary
        run: |
          echo "✅ Edge Functions publicadas no Supabase!"
          echo "  leads, enrollments, admin-resources"
          echo "  Commit: ${{ github.sha }}"
