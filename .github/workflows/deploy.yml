name: Deploy to Locaweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET || 'build-default-secret-32chars-minimum-length' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'build-default-key' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || 'postgresql://user:pass@localhost/db' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://localhost:3000' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            .next/
            package.json
            package-lock.json
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    name: Deploy to Production
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./build-artifacts

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t rsa -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare remote directory
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o HostKeyAlgorithms=ssh-rsa \
            -o PubkeyAcceptedKeyTypes=ssh-rsa \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

          set -e
          echo "🚀 Starting deployment..."
          APP_DIR="$HOME/app"

          # Create app directory if needed
          if [ ! -d "$APP_DIR" ]; then
            echo "📁 Creating app directory..."
            mkdir -p $APP_DIR
          fi

          # Backup current state
          echo "📦 Creating backup..."
          BACKUP_DIR="$HOME/backups/backup-$(date +%Y%m%d-%H%M%S)"
          mkdir -p $BACKUP_DIR
          if [ -d "$APP_DIR" ] && [ "$(ls -A $APP_DIR)" ]; then
            cp -r $APP_DIR/* $BACKUP_DIR/ 2>/dev/null || true
          fi

          # Clean build artifacts only (keep node_modules)
          echo "🧹 Cleaning previous build..."
          cd $APP_DIR
          rm -rf .next || true
          rm -f package*.json || true

          echo "✅ Directory ready for deployment"

          EOF

      - name: Copy build artifacts via SCP
        run: |
          scp -i ~/.ssh/deploy_key \
            -o HostKeyAlgorithms=ssh-rsa \
            -o PubkeyAcceptedKeyTypes=ssh-rsa \
            -o StrictHostKeyChecking=no \
            -r ./build-artifacts/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/app/

      - name: Install dependencies and restart
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o HostKeyAlgorithms=ssh-rsa \
            -o PubkeyAcceptedKeyTypes=ssh-rsa \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

          set -e
          cd $HOME/app

          echo "📚 Installing dependencies..."
          npm ci --only=production 2>/dev/null || npm install --production

          # Stop PM2 gracefully
          echo "🛑 Stopping application..."
          pm2 stop site-rh-cursos || true

          # Restart PM2 app
          echo "▶️ Starting application..."
          pm2 restart site-rh-cursos || pm2 start npm --name site-rh-cursos -- start
          pm2 save

          # Wait for app to start
          sleep 5

          # Health check
          echo "🏥 Running health check..."
          if curl -f http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Application is responding correctly"
          else
            echo "⚠️ Health check warning: application may not be fully ready"
          fi

          # Cleanup old backups (keep last 10)
          echo "🧹 Cleaning old backups..."
          ls -t $HOME/backups 2>/dev/null | tail -n +11 | xargs -r rm -rf 2>/dev/null || true

          echo "✅ Deployment completed successfully"
          echo "📊 App status:"
          pm2 list

          EOF

      - name: Verify deployment
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o HostKeyAlgorithms=ssh-rsa \
            -o PubkeyAcceptedKeyTypes=ssh-rsa \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

          pm2 list
          echo "✅ Deployment verification complete"

          EOF

      - name: Notify success
        if: success()
        run: |
          echo "🚀 Deployment to production completed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Branch: ${{ github.ref }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Please check the logs above for details"
          exit 1
