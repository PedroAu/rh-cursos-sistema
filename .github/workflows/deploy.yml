name: Deploy to Locaweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET || 'build-default-secret-32chars-minimum-length' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'build-default-key' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || 'postgresql://user:pass@localhost/db' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://localhost:3000' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    name: Deploy to Production
    environment: production

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./build-artifacts

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build-artifacts/
          server-dir: /app/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/node_modules/**
            **/.env*

      - name: Notify success
        if: success()
        run: |
          echo "🚀 Deployment to production completed via FTP!"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Branch: ${{ github.ref }}"
          echo ""
          echo "📋 Next step - Complete setup via HTTP:"
          echo "Visit: https://www.rhcursos.com.br/setup.php?token=setup-$(date +%Y-%m-%d)"
          echo ""
          echo "This will:"
          echo "  1. Install Node.js 24.9.0"
          echo "  2. Run npm ci --only=production"
          echo "  3. Start the application"
          echo ""
          echo "⚠️  After setup, delete setup.php from the server for security"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Please check the logs above for details"
          exit 1
