name: Deploy Static Site to Locaweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build Static Export
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Falha CEDO e com mensagem clara se algum secret de produção estiver
      # faltando. Sem isso, o build usava fallbacks ('example.supabase.co') e
      # publicava um site apontando para um Supabase inexistente — quebrando
      # em produção sem nenhum erro no deploy.
      - name: Validate required production secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
        run: |
          missing=0
          for var in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_APP_URL AUTH_SESSION_SECRET; do
            if [ -z "${!var}" ]; then
              echo "❌ Secret obrigatório ausente: $var"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Configure os secrets em: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "✅ Todos os secrets de produção estão presentes."

      - name: Run type check
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Upload static files
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    name: Deploy to Locaweb
    environment: production

    steps:
      - name: Download static files
        uses: actions/download-artifact@v4
        with:
          name: static-export
          path: ./public-static

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public-static/
          server-dir: /public_html/
          dangerous-clean-slate: false

      - name: Verify deployment
        run: |
          echo "✅ Static site deployed to Locaweb!"
          echo ""
          echo "📋 Deployment Summary:"
          echo "  Commit: ${{ github.sha }}"
          echo "  Author: ${{ github.actor }}"
          echo "  Branch: ${{ github.ref }}"
          echo "  Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo ""
          echo "🌐 Access at: https://www.rhcursos.com.br"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Please check the logs above for details"
          exit 1
