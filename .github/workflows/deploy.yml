name: Deploy to Locaweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET || 'build-default-secret-32chars-minimum-length' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'build-default-key' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || 'postgresql://user:pass@localhost/db' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://localhost:3000' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    name: Deploy to Production
    environment: production

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./build-artifacts

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build-artifacts/
          server-dir: /app/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/node_modules/**
            **/.env*

      - name: Install Node.js on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔍 Checking Node.js..."
            if ! command -v node &> /dev/null; then
              echo "📦 Installing Node.js 20..."

              # Detect OS and install accordingly
              if [ -f /etc/redhat-release ]; then
                echo "CentOS/RedHat detected"
                curl -fsSL https://rpm.nodesource.com/setup_20.x | bash - || true
                yum install -y nodejs || dnf install -y nodejs
              elif [ -f /etc/debian_version ]; then
                echo "Debian/Ubuntu detected"
                curl -fsSL https://deb.nodesource.com/setup_20.x | bash - || true
                apt-get update -qq && apt-get install -y nodejs
              else
                echo "Unknown OS, trying to install from source..."
                cd /tmp && curl -O https://nodejs.org/dist/v20.11.0/node-v20.11.0-linux-x64.tar.xz
                tar -xf node-v20.11.0-linux-x64.tar.xz
                ln -sf /tmp/node-v20.11.0-linux-x64/bin/node /usr/local/bin/node
                ln -sf /tmp/node-v20.11.0-linux-x64/bin/npm /usr/local/bin/npm
              fi
              echo "✅ Node.js installed"
            else
              echo "✅ Node.js already installed: $(node --version)"
            fi
            node --version
            npm --version

      - name: Install dependencies on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/app
            echo "📚 Installing dependencies..."
            npm ci --only=production
            echo "▶️ Starting application..."
            npm start > /tmp/app.log 2>&1 &
            sleep 2
            echo "✅ Application started"

      - name: Notify success
        if: success()
        run: |
          echo "🚀 Deployment to production completed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Branch: ${{ github.ref }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Please check the logs above for details"
          exit 1
